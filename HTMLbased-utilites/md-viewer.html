<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0f0e0d;
    --surface:   #1a1916;
    --border:    #2e2c28;
    --accent:    #c9a96e;
    --accent2:   #7b9e87;
    --text:      #e8e4dc;
    --muted:     #7a7568;
    --code-bg:   #161512;
    --sidebar-w: 280px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 17px;
    line-height: 1.75;
    overflow: hidden;
  }

  /* ── Layout ── */
  #shell {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    grid-template-rows: 56px 1fr;
    height: 100vh;
  }

  /* ── Top Bar ── */
  #topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: relative;
  }
  #topbar h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
    margin-right: auto;
  }
  #topbar h1 span { font-style: italic; font-weight: 400; color: var(--muted); font-size: 0.95rem; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 16px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn:hover { background: var(--border); color: var(--accent); border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #0f0e0d; border-color: var(--accent); font-weight: 700; }
  .btn.primary:hover { background: #d4b47f; }
  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }
  .btn:disabled:hover {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
  }

  #word-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  /* ── Sidebar ── */
  #sidebar {
    border-right: 1px solid var(--border);
    background: var(--surface);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    padding: 16px 0;
  }
  #sidebar-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.63rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    padding: 0 20px 10px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }
  #toc { list-style: none; padding: 0 10px; }
  #toc li a {
    display: block;
    padding: 5px 10px;
    border-radius: 4px;
    color: var(--muted);
    text-decoration: none;
    font-family: 'Source Serif 4', serif;
    font-size: 0.82rem;
    line-height: 1.4;
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #toc li a:hover { background: var(--border); color: var(--text); }
  #toc li.h1 a { font-weight: 600; color: var(--text); padding-left: 10px; }
  #toc li.h2 a { padding-left: 18px; }
  #toc li.h3 a { padding-left: 30px; font-size: 0.78rem; }
  #toc li.h4 a { padding-left: 42px; font-size: 0.75rem; color: var(--muted); }

  #empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 32px 20px;
    text-align: center;
    color: var(--muted);
  }
  #empty-state svg { opacity: 0.3; }
  #empty-state p { font-size: 0.82rem; line-height: 1.5; }

  /* ── Main Content ── */
  #main {
    overflow-y: auto;
    padding: 0;
    position: relative;
  }

  #drop-zone {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    color: var(--muted);
    transition: background 0.2s;
  }
  #drop-zone.active { background: rgba(201,169,110,0.04); }
  #drop-zone .drop-icon {
    width: 80px;
    height: 80px;
    border: 2px dashed var(--border);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s;
  }
  #drop-zone.active .drop-icon { border-color: var(--accent); }
  #drop-zone h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 400;
    color: var(--text);
    font-style: italic;
  }
  #drop-zone p { font-size: 0.85rem; }
  #drop-zone kbd {
    display: inline-block;
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--accent);
    background: var(--surface);
  }

  #article {
    display: none;
    max-width: 760px;
    margin: 0 auto;
    padding: 60px 48px 100px;
  }
  #article.visible { display: block; }

  /* ── Markdown Styles ── */
  #article h1, #article h2, #article h3, #article h4, #article h5, #article h6 {
    font-family: 'Playfair Display', serif;
    color: var(--text);
    line-height: 1.3;
    margin: 2.2em 0 0.6em;
    scroll-margin-top: 80px;
  }
  #article h1 { font-size: 2.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; margin-top: 0; }
  #article h2 { font-size: 1.55rem; }
  #article h3 { font-size: 1.2rem; font-style: italic; color: var(--accent); }
  #article h4 { font-size: 1rem; font-weight: 700; font-family: 'Source Serif 4', serif; letter-spacing: 0.05em; }
  #article h5, #article h6 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

  #article p { margin: 0 0 1.2em; }
  #article strong { color: var(--accent); font-weight: 600; }
  #article em { font-style: italic; color: #c8c2b6; }

  #article a { color: var(--accent2); text-decoration: underline; text-underline-offset: 3px; }
  #article a:hover { color: var(--accent); }

  #article ul, #article ol {
    padding-left: 1.6em;
    margin-bottom: 1.2em;
  }
  #article li { margin-bottom: 0.3em; }
  #article li::marker { color: var(--accent); }

  #article blockquote {
    border-left: 3px solid var(--accent);
    margin: 1.5em 0;
    padding: 0.6em 1.4em;
    background: rgba(201,169,110,0.05);
    border-radius: 0 4px 4px 0;
    color: #c8c2b6;
    font-style: italic;
  }

  #article code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82em;
    background: var(--code-bg);
    color: var(--accent);
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }
  #article pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    overflow-x: auto;
    margin: 1.5em 0;
  }
  #article pre code {
    background: none;
    border: none;
    padding: 0;
    color: #b8c4a8;
    font-size: 0.83em;
    line-height: 1.7;
  }

  #article table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.5em 0;
    font-size: 0.9em;
  }
  #article th {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72em;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 10px 14px;
    text-align: left;
  }
  #article td {
    border: 1px solid var(--border);
    padding: 9px 14px;
    vertical-align: top;
  }
  #article tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

  #article hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2.5em 0;
  }

  #article img {
    max-width: 100%;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin: 1em 0;
  }

  /* Checkbox lists */
  #article input[type="checkbox"] { accent-color: var(--accent); margin-right: 6px; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* ── Filename badge ── */
  #filename {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 20px;
    display: none;
  }
  #filename.visible { display: block; }

  /* ── Print ── */
  @media print {
    #shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    #sidebar, #topbar, #drop-zone { display: none !important; }
    #article { max-width: 100%; padding: 20px; display: block !important; }
    body { background: white; color: black; }
    html, body { overflow: visible; }
  }

  /* Fade-in */
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
  #article.visible { animation: fadeIn 0.3s ease; }
</style>
</head>
<body>

<div id="shell">

  <!-- Top Bar -->
  <header id="topbar">
    <h1>MD <span>viewer</span></h1>
    <span id="filename"></span>
    <span id="word-count"></span>
    <button class="btn" id="btn-copy" style="display:none">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      COPY MD
    </button>

    <label class="btn primary" for="file-input">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      OPEN FILE
    </label>
    <button class="btn" id="btn-export-pdf" type="button" style="display:none" disabled>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/>
        <path d="M14 2v6h6"/>
        <path d="M8 15h8"/>
        <path d="M8 19h6"/>
      </svg>
      EXPORT PDF
    </button>
    <input type="file" id="file-input" accept=".md,.markdown,.txt" style="display:none">
  </header>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div id="sidebar-label">Table of Contents</div>
    <div id="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
      </svg>
      <p>Open a <strong>.md</strong> file<br>to see its contents here</p>
    </div>
    <ul id="toc" style="display:none"></ul>
  </aside>

  <!-- Main -->
  <main id="main">
    <div id="drop-zone">
      <div class="drop-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="12" y2="12"/>
          <line x1="15" y1="15" x2="12" y2="12"/>
        </svg>
      </div>
      <h2>Drop a Markdown file</h2>
      <p>or use <kbd>Open File</kbd> above</p>
      <p style="font-size:0.75rem; margin-top:4px;">Supports .md · .markdown · .txt</p>
    </div>
    <article id="article"></article>
  </main>

</div>

<script>
  // Configure marked
  marked.setOptions({
    gfm: true,
    breaks: false,
    pedantic: false,
  });

  // Custom renderer for IDs on headings
  const renderer = new marked.Renderer();
  renderer.heading = function(text, level) {
    const id = text.toLowerCase().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').trim();
    return `<h${level} id="${id}">${text}</h${level}>`;
  };
  marked.use({ renderer });

  let rawMarkdown = '';

  const fileInput = document.getElementById('file-input');
  const dropZone  = document.getElementById('drop-zone');
  const article   = document.getElementById('article');
  const toc       = document.getElementById('toc');
  const emptyState = document.getElementById('empty-state');
  const filenameEl = document.getElementById('filename');
  const wordCount  = document.getElementById('word-count');
  const btnCopy    = document.getElementById('btn-copy');
  const btnExportPdf = document.getElementById('btn-export-pdf');


  function renderFile(text, name) {
    rawMarkdown = text;
    article.innerHTML = marked.parse(text);
    article.classList.add('visible');
    dropZone.style.display = 'none';

    buildToc();

    // Filename badge
    filenameEl.textContent = name;
    filenameEl.classList.add('visible');

    // Word count
    const words = text.trim().split(/\s+/).filter(Boolean).length;
    const readMin = Math.ceil(words / 200);
    wordCount.textContent = `${words.toLocaleString()} words · ~${readMin} min read`;

    btnCopy.style.display = '';
    btnExportPdf.style.display = '';
    btnExportPdf.disabled = false;

  }

  function buildToc() {
    const headings = article.querySelectorAll('h1, h2, h3, h4');
    toc.innerHTML = '';
    if (headings.length === 0) {
      emptyState.style.display = 'flex';
      toc.style.display = 'none';
      return;
    }
    emptyState.style.display = 'none';
    toc.style.display = 'block';
    headings.forEach(h => {
      const li = document.createElement('li');
      li.className = h.tagName.toLowerCase();
      const a = document.createElement('a');
      a.textContent = h.textContent;
      a.style.cursor = 'pointer';
      a.addEventListener('click', () => {
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      li.appendChild(a);
      toc.appendChild(li);
    });
  }

  // File input
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    readFile(file);
    e.target.value = '';
  });

  function readFile(file) {
    const reader = new FileReader();
    reader.onload = ev => renderFile(ev.target.result, file.name);
    reader.readAsText(file);
  }

  // Drag and Drop
  document.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('active'); });
  document.addEventListener('dragleave', e => { if (!e.relatedTarget) dropZone.classList.remove('active'); });
  document.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('active');
    const file = e.dataTransfer.files[0];
    if (file) readFile(file);
  });

  // Copy raw markdown — uses textarea fallback for file:// contexts
  btnCopy.addEventListener('click', () => {
    const ta = document.createElement('textarea');
    ta.value = rawMarkdown;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none;';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);

    if (ok) {
      const orig = btnCopy.innerHTML;
      btnCopy.innerHTML = '✓ COPIED';
      btnCopy.style.color = 'var(--accent2)';
      setTimeout(() => { btnCopy.innerHTML = orig; btnCopy.style.color = ''; }, 1800);
    }
  });

  btnExportPdf.addEventListener('click', () => {
    if (!rawMarkdown.trim()) return;
    window.print();
  });


</script>
</body>
</html>
