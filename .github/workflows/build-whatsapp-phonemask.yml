name: Build WhatsApp PII Masker

on:
  push:
    paths:
      - 'WhatsAppPhoneMask/**'
      - '.github/workflows/build-whatsapp-phonemask.yml'
  pull_request:
    paths:
      - 'WhatsAppPhoneMask/**'
      - '.github/workflows/build-whatsapp-phonemask.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: WhatsAppPhoneMask

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'WhatsAppPhoneMask/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run Tests (pytest)
        run: |
          python -m pytest tests/ -v

      - name: Run CLI Regression Check
        run: |
          python src/cli.py --selftest

      - name: Build CLI Executable
        run: |
          pyinstaller build/build_cli.spec

      - name: Build GUI Executable
        run: |
          pyinstaller build/build_gui.spec

      # OPTIONAL: Code signing step using signtool
      # This step is commented out by default and can be enabled if you have a code signing certificate.
      # - name: Sign Executables
      #   if: env.HAS_SIGNING_SECRET == 'true'
      #   env:
      #     CODE_SIGN_CERT_BASE64: ${{ secrets.CODE_SIGN_CERT_BASE64 }}
      #     CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
      #   run: |
      #     # Decode the PFX certificate from base64
      #     [System.Convert]::FromBase64String($env:CODE_SIGN_CERT_BASE64) | Set-Content cert.pfx -Encoding Byte
      #     
      #     # Sign the executables
      #     & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /f cert.pfx /p $env:CODE_SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/phone_mask.exe
      #     & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /f cert.pfx /p $env:CODE_SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist/WhatsApp PII Masker.exe"
      #     
      #     # Clean up certificate file
      #     Remove-Item cert.pfx -Force

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          Get-FileHash -Path "dist/phone_mask.exe", "dist/WhatsApp PII Masker.exe" -Algorithm SHA256 | Format-List > dist/sha256_checksums.txt
          cat dist/sha256_checksums.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-pii-masker-executables
          path: |
            WhatsAppPhoneMask/dist/phone_mask.exe
            WhatsAppPhoneMask/dist/WhatsApp PII Masker.exe
            WhatsAppPhoneMask/dist/sha256_checksums.txt
          if-no-files-found: error
